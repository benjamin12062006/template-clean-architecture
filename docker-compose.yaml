services:
  next-init: # Este servicio se encarga de instalar las dependencias utilizando Bun
    image: nextjs-bun
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile
    working_dir: /usr/src/app
    volumes:
      - ./Estadistica-Forms:/usr/src/app
      - bun_cache:/root/.bun
#    command: bun install
    # el comando se utilzara para instalar las dependencias y luego se detendra, el servicio next-app esperara a que este servicio termine exitosamente antes de iniciar
    entrypoint: ["sh", "-c", "bun install"]
    # docker compose run --rm next-app bun add dotenv
    # para agregar nuevas dependencias, esto se ejecutara dentro del contenedor y se guardara en el cache de bun para que no se tenga que volver a descargar en futuras instalaciones


  next-app:
    image: nextjs-bun
    working_dir: /usr/src/app
    volumes:
      - ./Estadistica-Forms:/usr/src/app
      - bun_cache:/root/.bun
      - node_modules:/usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
        next-init:
          condition: service_completed_successfully
    command: sh -c "bun install && bun run dev"

volumes:
  bun_cache:
  node_modules:
